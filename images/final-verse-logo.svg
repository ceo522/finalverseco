<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Final Verse Logo</title>
  <desc id="desc">Final Verse - The Memorial Song Co. logo in white and gold on a transparent background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="45%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#B98216"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .script {
        font-family: "Georgia", "Times New Roman", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -8px;
      }
      .tagline {
        font-family: "Arial", "Helvetica", sans-serif;
        font-weight: 600;
        letter-spacing: 16px;
      }
    </style>
  </defs>

  <!-- Transparent background by design -->

  <!-- Main wordmark -->
  <text x="190" y="280" class="script" font-size="190" fill="#ffffff">Final Verse</text>

  <!-- Gold music note -->
  <g transform="translate(1290 96)" filter="url(#softGlow)">
    <path d="M75 12 C92 42 116 61 146 75 C126 79 108 88 95 105 L95 237
             C95 276 63 306 26 301 C-8 296 -26 269 -15 239 C-4 210 31 193 66 203
             L66 28 C66 14 69 8 75 12Z" fill="url(#gold)"/>
    <ellipse cx="28" cy="250" rx="52" ry="37" transform="rotate(-20 28 250)" fill="url(#gold)"/>
  </g>

  <!-- Gold underline swoosh -->
  <path d="M260 353 C520 402 970 400 1275 333"
        fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M417 383 C675 420 1010 414 1268 363"
        fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M1155 386 C1235 390 1307 367 1366 321"
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Tagline -->
  <text x="516" y="468" class="tagline" font-size="42" fill="#ffffff">THE MEMORIAL SONG CO.</text>
</svg>
