<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9952a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="520" height="160" fill="#000000" rx="8"/>

  <!-- Main script text: Final Verse -->
  <text
    x="260"
    y="90"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    font-style="italic"
    font-weight="bold"
    fill="white"
    letter-spacing="2"
  >Final Verse</text>

  <!-- Gold swoosh left -->
  <path d="M 55 105 Q 130 120 200 108 Q 255 100 270 105" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Gold swoosh right -->
  <path d="M 270 105 Q 310 110 380 104 Q 430 100 465 95" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Gold music note (eighth note) -->
  <g transform="translate(454, 30) scale(1.1)">
    <!-- Note head -->
    <ellipse cx="10" cy="30" rx="8" ry="6" fill="url(#goldGrad)" transform="rotate(-20, 10, 30)"/>
    <!-- Stem -->
    <line x1="17" y1="27" x2="17" y2="3" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Flag -->
    <path d="M 17 3 Q 30 8 24 18" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tagline -->
  <text
    x="260"
    y="135"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="normal"
    fill="#cccccc"
    letter-spacing="4"
  >THE MEMORIAL SONG CO.</text>
</svg>
