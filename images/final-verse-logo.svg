<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&amp;display=swap');
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8A832"/>
      <stop offset="100%" style="stop-color:#D4AA30"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="600" height="200" fill="#000000"/>

  <!-- Main title: Final Verse -->
  <text
    x="290"
    y="108"
    text-anchor="middle"
    font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif"
    font-size="78"
    font-style="italic"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="1"
  >Final Verse</text>

  <!-- Gold swoosh — double line, gentle concave arc under text -->
  <path d="M 72 128 Q 290 142 510 128" stroke="#C8A832" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 72 133 Q 290 147 510 133" stroke="#C8A832" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Tagline — sits centered between the swoosh lines -->
  <text
    x="290"
    y="162"
    text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12"
    font-weight="400"
    fill="#FFFFFF"
    letter-spacing="5"
  >THE MEMORIAL SONG CO.</text>

  <!-- Gold eighth note — upper right -->
  <g transform="translate(490, 42)" fill="#C8A832">
    <!-- Note head -->
    <ellipse cx="9" cy="28" rx="7" ry="5.5" transform="rotate(-15, 9, 28)"/>
    <!-- Stem -->
    <rect x="14.5" y="4" width="2.2" height="24" rx="1"/>
    <!-- Flag -->
    <path d="M 16.7 4 Q 28 10 22 22" stroke="#C8A832" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

</svg>
