<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Not Completed — Final Verse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1A1A1A;
      color: #ffffff;
      font-family: 'Lato', system-ui, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .page-wrap {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: #D4AF37;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 40px;
    }
    .gold-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #D4AF37, transparent);
      margin: 1.25rem auto;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    .body-text {
      font-size: 0.97rem;
      color: #c0b9a8;
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      background: #D4AF37;
      color: #1A1A1A;
      font-family: 'Lato', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      border: 2px solid #D4AF37;
      transition: background 0.25s, transform 0.25s;
      margin-bottom: 1.5rem;
    }
    .btn-gold:hover {
      background: #e8c94f;
      transform: translateY(-2px);
    }
    .contact-line {
      font-size: 0.85rem;
      color: #9a9a9a;
    }
    .contact-line a {
      color: #D4AF37;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="wordmark">Final Verse</div>
    <div class="tagline">The Memorial Song Company</div>

    <p style="font-size:2.5rem;margin-bottom:0.5rem;">&#x26A0;&#xFE0F;</p>
    <h1>Payment Not Completed</h1>
    <div class="gold-line"></div>

    <p class="body-text">Your payment was not completed and your tribute order has not entered production. No charge was made to your card.</p>

    <a href="/" class="btn-gold">← Return to Checkout</a>

    <div class="contact-line">Need help? Email us at <a href="mailto:ceo@dortchai.com">ceo@dortchai.com</a> or call <a href="tel:+18778770417">877-877-0417</a></div>
  </div>
</body>
</html>
